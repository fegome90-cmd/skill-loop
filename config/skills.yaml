version: 1
skills:
  - id: evidence-first
    path: skills/evidence-first/SKILL.md
    description: >
      Fuerza intención explícita, evidencia verificable y reconciliación antes
      de declarar un cierre.
    phases: [clarify, reflect, reconcile]
    tags: [evidence, governance]
    keywords: [evidencia, evidence, cierre, reconciliar, verificar, trazabilidad]
    paths: []
    priority: 90
    risk: low
    capabilities: [read]
    requires: []
    default: false

  - id: python-quality
    path: skills/python-quality/SKILL.md
    description: >
      Gates mínimos de Python: Ruff, mypy y pytest antes de observar o cerrar.
    phases: [operate, observe]
    tags: [python, quality]
    keywords: [python, pytest, ruff, mypy, lint, test, tipado]
    paths: ["**/*.py", "pyproject.toml"]
    priority: 80
    risk: low
    capabilities: [read, write, execute]
    requires: [python]
    default: false

  - id: git-hygiene
    path: skills/git-hygiene/SKILL.md
    description: >
      Higiene de ramas, worktrees, commits acotados y árbol limpio al cierre.
    phases: [operate, reconcile, handoff]
    tags: [git, hygiene]
    keywords: [git, commit, rama, branch, worktree, merge, diff]
    paths: [".gitignore"]
    priority: 70
    risk: low
    capabilities: [read, execute]
    requires: [git]
    default: false
