version: 1
name: skill-loop
description: >
  Ciclo CLOOP del Anexo I de la Constitución de Código Agéntico. Cada fase
  declara sus leyes aplicables, sus gates de entrada/salida y cuántas skills
  puede cargar como máximo (JIT).

selection:
  min_score: 1
  max_skills: 5

quality:
  timeout_seconds: 300
  commands:
    - ["uv", "run", "ruff", "check", "."]
    - ["uv", "run", "ruff", "format", "--check", "."]
    - ["uv", "run", "mypy", "src"]
    - ["uv", "run", "pytest", "-q"]

phases:
  - id: clarify
    title: Clarify
    purpose: Comprender antes de mutar. Delimitar objetivo, alcance, riesgo y fuente de verdad.
    laws: [I.1, I.2, II.1, II.5, VI.1, XII.2, XIII.5]
    entry_gates: [constitution.integrity]
    exit_gates: []
    evidence_kind: clarification
    max_skills: 3

  - id: layout
    title: Layout
    purpose: Planificar antes de ejecutar. Declarar superficie, validación y fuera de alcance.
    laws: [I.2, I.3, I.5, III.7, X.1, X.2, X.3, XII.4]
    entry_gates: [plan.frozen]
    exit_gates: []
    evidence_kind: layout
    max_skills: 4

  - id: operate
    title: Operate
    purpose: Ejecutar de forma aislada, con mínimo privilegio y sin expandir alcance.
    laws: [I.1, I.6, III.1, III.5, IV.2, IV.3, IV.5, VIII.1, VIII.3, VIII.9, X.4]
    entry_gates: []
    exit_gates: [scope.compliance]
    evidence_kind: operation
    max_skills: 5

  - id: observe
    title: Observe
    purpose: Verificar comportamiento real y distinguir "corrió" de "está sano".
    laws: [V.1, V.2, V.3, V.4, V.6, V.8, XI.2, XI.3]
    entry_gates: []
    exit_gates: [quality.commands]
    evidence_kind: observation
    max_skills: 4

  - id: reflect
    title: Reflect
    purpose: Simplificar complejidad accidental y eliminar residuos antes del cierre.
    laws: [III.3, III.5, V.7, XI.6]
    entry_gates: []
    exit_gates: []
    evidence_kind: reflection
    max_skills: 3

  - id: reconcile
    title: Reconcile
    purpose: Alinear código, documentación, contratos y evidencia sin contradicciones vivas.
    laws: [VI.1, VI.3, VI.4, VI.5, VI.6, X.5, XI.8]
    entry_gates: []
    exit_gates: [docs.reconciled]
    evidence_kind: reconciliation
    max_skills: 4

  - id: handoff
    title: Handoff
    purpose: Dejar el trabajo listo para revisión, integración o retomada.
    laws: [IV.4, IV.6, IV.7, X.6, XI.8, XII.5]
    entry_gates: []
    exit_gates: [git.clean, evidence.chain]
    evidence_kind: handoff
    max_skills: 3
