name: Repository security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Secrets and private paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the candidate and its history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: incoming
          fetch-depth: 0
          persist-credentials: false

      - name: Load the base branch policy for pull requests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: policy
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Load the pinned policy for the initial pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.sha == 'e36309cca9cc634e9c4a9e16e821888a22fc5ac5'
        working-directory: incoming
        run: |
          mkdir -p ../policy/scripts
          git cat-file blob 4f3b04122fbaf49887ba18a3e641d0243fed1616 > ../policy/.gitleaks.toml
          git cat-file blob b750d5bbee2b4e87d7d18ccbdbf2b7091a64d9d1 > ../policy/scripts/check-secrets.sh
          git cat-file blob ac75ab4f94c46fa1108274af09daa784ef9fcdc6 > ../policy/scripts/check-sensitive-paths.py
          (cd ../policy && sha256sum -c - <<'SUMS'
          5e30ca26527f466119072c1657e3bd716deab5ba86a8694ce3a3f78569ff79e2  .gitleaks.toml
          68cb2e0bb6a53714312e65040d7424e45509a37914144d14cfcff09c294582d9  scripts/check-secrets.sh
          b25152300a5fedb531681ac45acda06bfb0e256e4798b715c3e6d688643af4f3  scripts/check-sensitive-paths.py
          SUMS
          )
          chmod +x ../policy/scripts/check-secrets.sh

      - name: Install verified Gitleaks CLI
        working-directory: ${{ runner.temp }}
        run: |
          version=8.30.1
          base=https://github.com/gitleaks/gitleaks/releases/download
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl --fail --silent --show-error --location --retry 2 \
            "$base/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${sha}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p security-bin
          tar -xzf gitleaks.tar.gz -C security-bin gitleaks
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"

      - name: Scan committed files and history
        working-directory: incoming
        run: ../policy/scripts/check-secrets.sh history
