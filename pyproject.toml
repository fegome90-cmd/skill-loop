[project]
name = "skillrun"
version = "0.1.0"
description = "Deterministic, ordered skill execution with grilling discovery (stdlib runtime)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Felipe Gonzalez" }]
dependencies = []

[project.scripts]
skillrun = "skillrun:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/skillrun.py"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".agents/skills", "reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "bandit>=1.8.0",
    "codespell>=2.4.0",
    "yamllint>=1.35.0",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
